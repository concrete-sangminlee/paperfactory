[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "paperfactory"
version = "1.1.0"
description = "AI agent for civil engineering research paper generation"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "SangMin Lee"},
]
keywords = [
    "research-paper", "civil-engineering", "structural-engineering",
    "machine-learning", "claude-code", "ai-agent",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "python-docx>=1.1.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "matplotlib>=3.7.0",
    "scipy>=1.11.0",
    "seaborn>=0.12.0",
    "reportlab>=4.0.0",
]

[project.optional-dependencies]
ui = ["streamlit>=1.30.0"]
dev = ["pytest>=7.0", "pytest-cov>=4.0", "ruff==0.16.9", "pre-commit>=3.0"]

[project.scripts]
paperfactory = "cli:main"

[project.urls]
Homepage = "https://github.com/concrete-sangminlee/paperfactory"
Repository = "https://github.com/concrete-sangminlee/paperfactory"
Changelog = "https://github.com/concrete-sangminlee/paperfactory/blob/main/CHANGELOG.md"

[tool.setuptools]
# cli.py lives at the repository root next to guidelines/ (use an editable install:
# `pip install -e .`, so the bundled guidelines/ folder stays importable).
py-modules = ["cli"]

[tool.setuptools.packages.find]
include = ["utils*", "pipeline*"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.format]
# Code blocks in README.md / CLAUDE.md are illustrative snippets; keep them as written.
exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = [
    "B008",   # function calls in defaults (argparse/streamlit idioms)
    "UP007",  # keep Optional[...] readable for py310 users
]

[tool.ruff.lint.per-file-ignores]
# Demo scripts embed full manuscript prose in string literals and add the repo
# root to sys.path before importing utils/.
"examples/**/*.py" = ["E501", "E402"]
# Tests deliberately construct long fixture strings.
"tests/**/*.py" = ["E501"]
# Package facade re-exports the public API.
"utils/__init__.py" = ["F401"]
"pipeline/__init__.py" = ["F401"]

[tool.ruff.lint.isort]
known-first-party = ["utils", "pipeline", "cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
    "ignore::DeprecationWarning:docx.*",
]

[tool.coverage.run]
source = ["utils", "pipeline", "cli"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
